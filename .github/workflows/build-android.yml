name: Build Android APK

# Debug APK for on-device testing (loads JS live from Metro over USB), and a
# self-contained release APK on a version tag. Chaquopy needs Python on the
# build machine; New Architecture is off and RN/Hermes ship prebuilt, so no
# native (NDK) compilation is required.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK to build"
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags:
      - "v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Chaquopy's buildPython — pin to the interpreter bundled into the APK.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decide variant
        id: v
        run: |
          # Tag push -> release; manual run -> the chosen input (default debug).
          case "$GITHUB_REF_NAME" in
            v*) echo "variant=release" >> "$GITHUB_OUTPUT" ;;
            *)  echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build APK
        working-directory: android
        run: |
          if [ "${{ steps.v.outputs.variant }}" = "release" ]; then
            # Derive versionName/versionCode from the tag (v1.2.3 -> 1.2.3), so
            # the installed app reports the release version and the in-app
            # updater compares correctly. A non-tag manual release build keeps
            # the gradle defaults.
            case "$GITHUB_REF_NAME" in
              v*)
                VER="${GITHUB_REF_NAME#v}"
                MA="$(echo "$VER" | cut -d. -f1)"; MA="${MA:-0}"
                MI="$(echo "$VER" | cut -d. -f2)"; MI="${MI:-0}"
                PA="$(echo "$VER" | cut -d. -f3)"; PA="${PA:-0}"
                export APP_VERSION_NAME="$VER"
                export APP_VERSION_CODE="$(( MA * 10000 + MI * 100 + PA ))"
                echo "Building release $APP_VERSION_NAME (code $APP_VERSION_CODE)"
                ;;
            esac
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Stage APK
        id: stage
        run: |
          if [ "${{ steps.v.outputs.variant }}" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            DEST="Music_Player.apk"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            DEST="Music_Player-debug.apk"
          fi
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.apk }}
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Music_Player ${{ github.ref_name }}"
          files: ${{ steps.stage.outputs.apk }}
          fail_on_unmatched_files: true

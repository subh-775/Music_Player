name: Build Android APK

# Debug APK for on-device testing (loads JS live from Metro over USB), and a
# self-contained release APK on a version tag. Chaquopy needs Python on the
# build machine; New Architecture is off and RN/Hermes ship prebuilt, so no
# native (NDK) compilation is required.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK to build"
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags:
      - "v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to work out the version of a MANUAL release build.
          # The default shallow clone has none.
          fetch-depth: 0

      # v1.2.1 was pushed from a stale local tag sitting on the v1.2.0 commit:
      # CI went green and published old code under a new number, and users on
      # it can't be offered the real build under that number again. A commit
      # carrying another release tag is always that mistake.
      - name: Refuse a commit that is already released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Pre-release tags (v1.2.15-rc1) do not count: they go to the
          # tester's phone only, and the final release of the same commit is
          # exactly what should follow them.
          OTHER="$(git tag --points-at HEAD 'v*' | grep -vx "$GITHUB_REF_NAME" | grep -v -- '-' || true)"
          if [ -n "$OTHER" ]; then
            echo "::error::$GITHUB_REF_NAME is on $(git rev-parse --short HEAD), already released as: $OTHER. Delete the tag and re-tag the intended commit."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Chaquopy's buildPython — pin to the interpreter bundled into the APK.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps
        run: npm ci

      # Types, tests and lint BEFORE the 20-minute Android build, so a broken
      # commit fails in one minute instead of paying for a full APK first.
      #
      # This is also the reason __tests__/ is committed rather than ignored: a
      # test that only exists on one machine protects nothing. Several of these
      # suites exist specifically to fail against a bug that already shipped —
      # playerMorph pins the release where the mini player went invisible — and
      # that is only worth anything if it runs on the commit being released.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      - name: Lint
        run: npx eslint src/ App.tsx __tests__/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decide variant
        id: v
        run: |
          # Tag push -> release; a pre-release tag (vX.Y.Z-anything) -> the
          # rc TEST variant, which installs as its own app (com.musicplayer.rc,
          # "Relaxify RC") and can never replace or touch the real one; manual
          # run -> the chosen input (default debug).
          case "$GITHUB_REF_NAME" in
            v*-*) echo "variant=rc" >> "$GITHUB_OUTPUT" ;;
            v*) echo "variant=release" >> "$GITHUB_OUTPUT" ;;
            *)  echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build APK
        working-directory: android
        run: |
          # Gradle through a tee, so a failure can be RAISED as annotations.
          # Job logs need a signed-in GitHub session to read, but a check
          # run's annotations are public — so the Kotlin compiler's `e:` lines
          # and Gradle's "What went wrong" become readable from the API by
          # anyone diagnosing a red tag, with no login. GitHub keeps ten error
          # annotations per step, so the most specific lines go first.
          gradle() {
            set +e
            ./gradlew "$@" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              { grep -E '^e: ' "$RUNNER_TEMP/gradle.log"
                grep -E -A3 'What went wrong' "$RUNNER_TEMP/gradle.log"
              } | head -10 | sed -e 's/%/%25/g' -e 's/^/::error::/'
            fi
            return "$status"
          }
          VARIANT="${{ steps.v.outputs.variant }}"
          if [ "$VARIANT" = "release" ] || [ "$VARIANT" = "rc" ]; then
            # Derive versionName/versionCode from the tag (v1.2.3 -> 1.2.3), so
            # the installed app reports the release version and the in-app
            # updater compares correctly.
            case "$GITHUB_REF_NAME" in
              v*) VER="${GITHUB_REF_NAME#v}" ;;
              *)
                # MANUAL release build (no tag). It used to fall through to the
                # gradle defaults — versionCode 1 — which Android rejects as a
                # DOWNGRADE against any installed release, surfacing on most
                # ROMs as "package appears to be invalid". So: take the newest
                # tag and bump the patch, giving a code above whatever is
                # installed and equal to the release this is a test build for
                # (an equal code still installs over itself).
                LAST="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
                B="${LAST#v}"
                VER="$(echo "$B" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
                echo "No tag — test build versioned $VER from last tag $LAST"
                ;;
            esac
            # A pre-release (1.2.15-rc1) is versioned by the release it
            # precedes: the suffix stays in the NAME, the code is 1.2.15's.
            BASE="${VER%%-*}"
            MA="$(echo "$BASE" | cut -d. -f1)"; MA="${MA:-0}"
            MI="$(echo "$BASE" | cut -d. -f2)"; MI="${MI:-0}"
            PA="$(echo "$BASE" | cut -d. -f3)"; PA="${PA:-0}"
            export APP_VERSION_NAME="$VER"
            export APP_VERSION_CODE="$(( MA * 10000 + MI * 100 + PA ))"
            echo "Building $VARIANT $APP_VERSION_NAME (code $APP_VERSION_CODE)"
            if [ "$VARIANT" = "rc" ]; then
              gradle assembleRc
            else
              gradle assembleRelease
            fi
          else
            gradle assembleDebug
          fi

      - name: Stage APK
        id: stage
        run: |
          if [ "${{ steps.v.outputs.variant }}" = "release" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            DEST="Relaxify.apk"
          elif [ "${{ steps.v.outputs.variant }}" = "rc" ]; then
            # Never "Relaxify.apk": a test build must not be mistaken for the
            # real one, by a person or by anything matching on the name.
            SRC=android/app/build/outputs/apk/rc/app-rc.apk
            DEST="Relaxify-RC.apk"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            DEST="Relaxify-debug.apk"
          fi
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.apk }}
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The repository is still Music_Player; the product is Relaxify.
          # This string is the release title on the releases page and the
          # filename people download onto the phone, so it follows the product.
          # Safe to rename: the in-app updater picks the first asset whose name
          # ENDS IN .apk rather than matching a fixed filename.
          name: "Relaxify ${{ github.ref_name }}"
          files: ${{ steps.stage.outputs.apk }}
          fail_on_unmatched_files: true
          # Every release so far has shipped with an EMPTY body, because
          # nothing was ever passed here. The in-app updater shows that body in
          # its popup and the docs site lists it, so both were saying nothing.
          # GitHub writes it from the commits since the last tag, which is at
          # least true and specific; a hand-written body still overrides it.
          generate_release_notes: true
          # vX.Y.Z-anything is a PRE-release: built and downloadable for
          # on-device testing, but never "latest" — and /releases/latest, the
          # only thing the in-app updater reads, skips pre-releases. So a test
          # build reaches the tester's phone over adb and nobody else's.
          prerelease: ${{ contains(github.ref_name, '-') }}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Embeds CPython + the Flask backend inside the APK. The Python sources live in
// src/main/python (copied from the Fix-Spotify backend: components/ + the
// mobile server). The React Native UI talks to it over http://127.0.0.1:<port>.
apply plugin: "com.chaquo.python"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.musicplayer"
    defaultConfig {
        applicationId "com.musicplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Derived from the git tag by CI (APP_VERSION_NAME / APP_VERSION_CODE),
        // so a `vX.Y.Z` release reports X.Y.Z. This is what the in-app updater
        // compares against GitHub's latest tag — if these stay constant, every
        // release looks identical and the updater loops forever offering the
        // same one. Local/dev builds fall back to the defaults below.
        versionCode(System.getenv("APP_VERSION_CODE") ? System.getenv("APP_VERSION_CODE").toInteger() : 1)
        versionName(System.getenv("APP_VERSION_NAME") ?: "1.0.0")

        ndk {
            // Must match reactNativeArchitectures in gradle.properties.
            abiFilters "arm64-v8a"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Installs alongside a release build, and — critically — binds a
            // DIFFERENT backend port. The distinct 877x range also keeps it clear
            // of any installed Fix-Spotify (8765/8766), so nothing collides.
            applicationIdSuffix ".debug"
            buildConfigField "int", "BACKEND_PORT", "8771"
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            // R8 shrinks/obfuscates the Java/Kotlin and strips unused resources —
            // the bulk of the APK is RN + androidx + kotlin-stdlib, and most of it
            // is dead weight for this app. Keep rules for the reflection-heavy
            // bits (RNTP internals, NewPipe/Rhino, Chaquopy) live in
            // proguard-rules.pro. VERIFY a release build boots before tagging.
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            // proguard-android.txt, NOT the "-optimize" variant. The optimize
            // profile inlines methods and merges classes, and everything that
            // makes the equalizer work is REFLECTION into RNTP/KotlinAudio
            // privates — exactly what those optimizations break, and only ever
            // at runtime in a release build. The size difference is small; the
            // failure mode is "the EQ silently does nothing", which is worse.
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            buildConfigField "int", "BACKEND_PORT", "8770"
        }
    }

    buildFeatures {
        // AGP 8 only generates BuildConfig on request; the backend port above is
        // read from BuildConfig.BACKEND_PORT in Kotlin.
        buildConfig true
    }

    packagingOptions {
        // Several transitive Python deps ship duplicate metadata files.
        resources.excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"

        pip {
            // Pure-Python only — Chaquopy can't install native wheels unless
            // they were built for Android. This is the JioSaavn-first skeleton
            // set; SoundCloud/YouTube via NewPipeExtractor come later with their
            // native dependency, and are lazily imported so their absence here
            // does not stop the backend from booting.
            install "flask==3.0.3"
            install "requests>=2.31.0"
            install "mutagen==1.47.0"
            install "yt-dlp>=2026.7.4"
        }

        // Precompile to .pyc at BUILD time, not on the phone.
        //
        // This was false, with a comment claiming the first import is "a hair
        // slower". It is not a hair. Shipping raw .py means CPython parses and
        // compiles every module on the DEVICE at first import — and yt-dlp
        // alone is ~1800 modules, on the SoundCloud play path. That cost is
        // paid again after every app update, because the update invalidates the
        // cache directory. It is the single biggest reason the first song after
        // an install feels terrible.
        //
        // CI build time goes up. That is a machine's problem, not the user's.
        pyc { src = true }
    }

    sourceSets {
        getByName("main") {
            srcDir "src/main/python"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // YouTube resolution. Android has no JS runtime to solve YouTube's signature
    // challenge, so yt-dlp can't do YouTube here; NewPipeExtractor does it
    // natively (bundled Rhino). Called from Python via YouTubeNP.kt. GPLv3, same
    // as this project. Pinned to the version Fix-Spotify runs in production.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'

    // Dominant-colour extraction from album art, for the player tint. This is
    // the platform's own answer to the problem (it ships in every Material
    // music app) — the WebView build used a canvas, which RN doesn't have.
    implementation 'androidx.palette:palette:1.0.0'
}
